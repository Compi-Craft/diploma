apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-service
  minReplicas: 1
  maxReplicas: 15
  behavior:
    scaleUp:
      policies:
      - type: Pods
        value: 2          # max 2 поди за раз
        periodSeconds: 30 # не частіше ніж раз на 30 секунд
    scaleDown:
      stabilizationWindowSeconds: 30  # чекати 30s перед downscale (дефолт K8s = 300s)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 500m  # scale when avg CPU per pod > 500m (50% of 1000m limit)
