apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-service
  minReplicas: 1
  maxReplicas: 15
  behavior:
    scaleUp:
      # No rate limit — scale to desired replicas in one step.
      # Isolates detection speed as the only variable vs predictive_hpa_stress.yaml.
      selectPolicy: Max
      policies:
      - type: Pods
        value: 15
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 500m  # scale when avg CPU per pod > 500m (50% of 1000m limit)
